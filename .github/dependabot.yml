version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript*',
            '@typescript/*',
            'prettier*',
            'vitest',
            '@playwright/*',
          ]
      runtime:
        patterns: ['motion', 'lenis', 'tailwindcss', '@tailwindcss/*', '@fontsource*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
